<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bora Lucrar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body class="login-page">

    <main class="login">

        <!-- LOGO -->
        <section class="login__brand">
            <img src="/static/img/logo.png" alt="Bora Lucrar">
        </section>

        <!-- FORM -->
        <section class="login__panel">
            <form id="login-form" class="login__form" method="post" novalidate>

                <div class="field">
                    <label for="email">E-mail</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor"
                                d="M3 5h18a1 1 0 0 1 1 1v.5l-10 6.2L2 6.5V6a1 1 0 0 1 1-1Zm-1 4.1 9.5 5.9a1 1 0 0 0 1 0L22 9.1V18a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V9.1Z" />
                        </svg>
                        <input type="email" id="email" name="email" placeholder="email@exemplo.com" autocomplete="email"
                            required>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Senha</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor"
                                d="M17 9h-1V7a4 4 0 0 0-7.8-1.3 1 1 0 1 0 1.9.6A2 2 0 0 1 14 7v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Z" />
                        </svg>
                        <input type="password" id="password" name="password" placeholder="••••••••"
                            autocomplete="current-password" required>
                        <button type="button" class="field__toggle" id="toggle-password" aria-label="Mostrar senha"
                            aria-pressed="false">
                            <!-- olho cortado (senha oculta) -->
                            <svg class="icon-hidden" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
                                <path stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M3 3l18 18" />
                            </svg>
                            <!-- olho aberto (senha visível) -->
                            <svg class="icon-visible" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
                            </svg>
                        </button>
                    </div>
                </div>

                <p class="login__error" id="login-error" role="alert" {% if not error %}hidden{% endif %}>{{ error }}
                </p>

                <button type="submit" class="btn btn--primary">LOGIN</button>

                <a class="login__forgot" href="/recovery">Esqueceu a senha?</a>

                <div class="divider"><span>OU</span></div>

                <button type="button" class="btn btn--google" id="btn-google">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335"
                            d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5Z" />
                        <path fill="#4285F4"
                            d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5Z" />
                        <path fill="#FBBC05"
                            d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1Z" />
                        <path fill="#34A853"
                            d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48Z" />
                    </svg>
                    <span>Entrar com o Google</span>
                </button>

                <p class="login__signup">
                    Não tem uma conta? <a href="/register">Cadastre-se grátis.</a>
                </p>
            </form>
        </section>

    </main>

    <script>
        // Mostrar / esconder senha
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("toggle-password");

        toggleButton.addEventListener("click", () => {
            const show = passwordInput.type === "password";
            passwordInput.type = show ? "text" : "password";
            toggleButton.setAttribute("aria-pressed", String(show));
            toggleButton.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha");
        });

        // Mensagem de erro
        const errorBox = document.getElementById("login-error");

        function showError(message) {
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        // Login com e-mail e senha
        document.getElementById("login-form").addEventListener("submit", (event) => {
            errorBox.hidden = true;

            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                event.preventDefault();
                showError("Preencha o e-mail e a senha.");
            }
        });
            // TODO: conectar com a rota de login do Flask / Firebase

        // Login com Google
        document.getElementById("btn-google").addEventListener("click", () => {
            // TODO: chamar o login com Google do Firebase
        });
    </script>
</body>

</html>
