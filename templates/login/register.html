<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Bora Lucrar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body class="login-page">

    <main class="login">

        <section class="login__brand">
            <img src="/static/img/logo.png" alt="Bora Lucrar">
        </section>

        <section class="login__panel">
            <form id="register-form" class="login__form" method="post" action="{{ url_for('auth.register') }}">

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <p class="login__error"
                    style="display: block; color: {% if category == 'success' %}#34A853{% else %}#EA4335{% endif %}; margin-bottom: 15px;">
                    {{ message }}</p>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <div class="field">
                    <label for="name">Nome</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor"
                                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                        </svg>
                        <input type="text" id="name" name="name" placeholder="Seu nome completo" required>
                    </div>
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor"
                                d="M3 5h18a1 1 0 0 1 1 1v.5l-10 6.2L2 6.5V6a1 1 0 0 1 1-1Zm-1 4.1 9.5 5.9a1 1 0 0 0 1 0L22 9.1V18a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V9.1Z" />
                        </svg>
                        <input type="email" id="email" name="email" placeholder="email@exemplo.com" autocomplete="email"
                            required>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Senha</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor"
                                d="M17 9h-1V7a4 4 0 0 0-7.8-1.3 1 1 0 1 0 1.9.6A2 2 0 0 1 14 7v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Z" />
                        </svg>
                        <input type="password" id="password" name="password" placeholder="••••••••"
                            autocomplete="new-password" required>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirmar Senha</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor"
                                d="M17 9h-1V7a4 4 0 0 0-7.8-1.3 1 1 0 1 0 1.9.6A2 2 0 0 1 14 7v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Z" />
                        </svg>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••"
                            autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn--primary" style="margin-top: 10px;">CADASTRAR</button>

                <p class="login__signup" style="margin-top: 20px;">
                    Já tem uma conta? <a href="/login">Faça login aqui</a>
                </p>
            </form>
        </section>

    </main>

</body>

</html>
